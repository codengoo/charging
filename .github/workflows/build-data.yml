name: Build station data

# Cron chạy build ETL (lấy version mới nhất của VinFast + enrich My Maps) rồi upload R2.
# Chạy ở CI của GitHub (Node đầy đủ, không dính giới hạn 10ms CPU của Workers Free plan).
on:
  schedule:
    - cron: '0 19 * * *' # 02:00 giờ VN mỗi ngày (UTC 19:00)
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions

concurrency:
  group: build-data
  cancel-in-progress: true

# Chỉ đọc repo; ghi R2 bằng token Cloudflare (secret), không cần quyền GitHub nào khác.
permissions:
  contents: read

env:
  # Cố định bản wrangler — `wrangler@4` trôi theo bản mới nhất có thể đổi cú pháp lệnh r2.
  WRANGLER: wrangler@4.162.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Lõi ETL chỉ dùng Node builtins (fetch/zlib/streams) → không cần npm install.
      - name: Build dữ liệu
        run: node builder/run-local.mjs

      # Snapshot cụt / My Maps lỗi thì dừng ở đây — manifest đang chạy giữ nguyên.
      - name: Kiểm tra trước khi upload
        run: node builder/check.mjs

      - name: Upload R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx -y $WRANGLER --version
          m() { node -e "console.log(require('./builder/out/manifest.json').$1)"; }
          BASE=$(m base)
          POWER=$(m power)
          SEO_DIR=$(m seo.dir)
          IMMUTABLE='public, max-age=31536000, immutable'
          put() { # put <key> <file> <cache-control>
            npx -y $WRANGLER r2 object put "tramsac-data/$1" --file="$2" --remote \
              --content-type=application/json --cache-control="$3"
          }
          # Tên file mang hash nội dung → không bao giờ ghi đè file cũ khác nội dung. File cũ
          # vẫn còn trên R2 nên client đang mở với manifest cũ tải tiếp được.
          put "$BASE" "builder/out/$BASE" "$IMMUTABLE"
          put "$POWER" "builder/out/$POWER" "$IMMUTABLE"
          # Shard tra cứu cho preview link /station/<id> (worker/index.ts) — trước manifest để
          # manifest mới không bao giờ trỏ tới shard chưa có. Chạy song song 8 lượt.
          export -f put
          export WRANGLER IMMUTABLE
          ls builder/out/$SEO_DIR/*.json | xargs -P 8 -I{} bash -c 'put "'"$SEO_DIR"'/$(basename {})" {} "$IMMUTABLE"'
          # manifest cuối cùng (con trỏ latest) — cache ngắn
          put "manifest.json" "builder/out/manifest.json" "public, max-age=300"
